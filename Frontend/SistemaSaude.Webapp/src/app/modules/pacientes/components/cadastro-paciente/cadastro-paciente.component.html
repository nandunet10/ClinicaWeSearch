<div class="container">
  <h2>Cadastro de Paciente</h2>
  <form #pacienteForm="ngForm">
    <div class="form-group">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" class="form-control" [(ngModel)]="paciente.nome" name="nome" required
        #nome="ngModel" />
    </div>
    <div class="form-group">
      <label for="telefone">Telefone:</label>
      <input type="text" id="telefone" class="form-control" [(ngModel)]="paciente.telefone" name="telefone" required
        #telefone="ngModel" mask="(00) 00000-0000" placeholder="(00) 0000-0000" />
    </div>
    <div class="form-group">
      <label for="sexo">Sexo:</label>
      <select id="sexo" class="form-control" [(ngModel)]="paciente.sexo" name="sexo">
        <option value="M">Masculino</option>
        <option value="F">Feminino</option>
      </select>
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" class="form-control" [(ngModel)]="paciente.email" name="email" required
        #email="ngModel" />
    </div>
  </form>
  <div class="d-flex justify-content-end">
    <button type="submit" class="btn btn-outline-primary margin5"
      [disabled]="!pacienteForm.form.valid" (click)="onSubmit()">Registrar</button>
    <button class="btn btn-outline-secondary margin5" (click)="voltar()">Voltar</button>
  </div>
</div>
